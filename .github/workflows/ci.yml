name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '.agents/**'
      - 'art_inbox/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '.agents/**'
      - 'art_inbox/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish the running regression; GitHub keeps only the newest pending run.
  # Frequent development pushes must not starve all complete SHA evidence.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          godot_zip="$RUNNER_TEMP/godot-4.7.2.zip"
          godot_dir="$RUNNER_TEMP/godot-4.7.2"
          curl --fail --location --retry 3 --output "$godot_zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $godot_zip" | sha256sum --check
          mkdir -p "$godot_dir"
          unzip -q "$godot_zip" -d "$godot_dir"
          godot_bin="$godot_dir/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$godot_bin"
          "$godot_bin" --version
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Python tool tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Import + test
        run: python -u tools/godot.py check --test-timeout 1800

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-logs
          path: |
            logs/*.log
            logs/*-timings-*.jsonl
          if-no-files-found: ignore
          retention-days: 14
